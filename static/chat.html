<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ForeverFurEver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand: #9580D6;
  --brand-dark: #7A68B8;
  --brand-light: #EDE9F6;
  --text: #1a1a1a;
  --text-muted: rgba(0,0,0,0.55);
  --bg: #f7f6fa;
  --white: #ffffff;
  --border: #e8e5ef;
}

body {
  font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
}

#chat-box {
  width: 440px;
  max-width: 100vw;
  margin: 20px auto;
  background: var(--white);
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(149,128,214,0.12);
  display: flex;
  flex-direction: column;
  height: calc(100vh - 40px);
  max-height: 700px;
  overflow: hidden;
}

#chat-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
#chat-header::before {
  content: "\2726";
  color: var(--brand);
  font-size: 16px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  word-wrap: break-word;
  white-space: pre-wrap;
}

.user {
  align-self: flex-end;
  background: var(--brand);
  color: var(--white);
  border-bottom-right-radius: 4px;
}

.ai {
  align-self: flex-start;
  background: var(--brand-light);
  color: var(--text);
  border-bottom-left-radius: 4px;
}

.typing {
  align-self: flex-start;
  padding: 10px 14px;
  background: var(--brand-light);
  border-radius: 12px;
  display: flex;
  gap: 4px;
}
.typing span {
  width: 6px; height: 6px;
  background: var(--brand);
  opacity: 0.5;
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
}

/* Product cards */
.product-cards {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 8px 0;
  scroll-snap-type: x mandatory;
}
.product-cards::-webkit-scrollbar { height: 4px; }
.product-cards::-webkit-scrollbar-thumb { background: var(--brand); border-radius: 2px; opacity: 0.4; }

.product-card {
  min-width: 160px;
  max-width: 180px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  scroll-snap-align: start;
  background: var(--white);
}
.product-card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  background: #f5f5f5;
}
.product-card-body { padding: 8px 10px; }
.product-card-title {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.product-card-price {
  font-size: 13px;
  font-weight: 700;
  color: var(--brand-dark);
  margin-top: 4px;
}
.product-card-btn {
  display: block;
  width: 100%;
  padding: 6px;
  margin-top: 6px;
  border: 1.5px solid var(--brand);
  border-radius: 6px;
  background: var(--white);
  color: var(--brand);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  font-family: inherit;
  transition: all 0.15s;
}
.product-card-btn:hover { background: var(--brand); color: var(--white); }
.product-card-buy {
  display: block;
  width: 100%;
  padding: 6px;
  margin-top: 4px;
  border: none;
  border-radius: 6px;
  background: var(--brand);
  color: var(--white);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  font-family: inherit;
  transition: background 0.15s;
}
.product-card-buy:hover { background: var(--brand-dark); }

/* Actions / Quick replies */
#actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 20px 8px;
}

.quick-reply {
  padding: 8px 14px;
  border: 1.5px solid var(--brand);
  border-radius: 20px;
  background: var(--white);
  color: var(--brand);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.quick-reply:hover { background: var(--brand); color: var(--white); }

.url-btn {
  padding: 8px 14px;
  border: none;
  border-radius: 20px;
  background: var(--brand);
  color: var(--white);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  font-family: inherit;
  transition: all 0.15s;
}
.url-btn:hover { background: var(--brand-dark); }

/* Input area */
#input-area {
  display: flex;
  gap: 8px;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
}

#input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s;
}
#input:focus { border-color: var(--brand); }

#send {
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  background: var(--brand);
  color: var(--white);
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  font-family: inherit;
  transition: background 0.15s;
}
#send:hover { background: var(--brand-dark); }

.msg, .product-cards { animation: fadeIn 0.25s ease-out; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.restored { animation: none; }

@media (max-width: 480px) {
  #chat-box { width: 100%; height: 100vh; max-height: none; margin: 0; border-radius: 0; }
}
</style>
</head>
<body>

<div id="chat-box">
  <div id="chat-header">ForeverFurEver</div>
  <div id="messages"></div>
  <div id="actions"></div>
  <div id="input-area">
    <input id="input" placeholder="Ask me anything..." maxlength="1000" />
    <button id="send">Send</button>
  </div>
</div>

<script>
var BASE_URL = window.location.origin;
var STREAM_URL = BASE_URL + "/chat/stream";
var FALLBACK_URL = BASE_URL + "/chat";
var TRACK_URL = BASE_URL + "/track";

var messagesEl = document.getElementById("messages");
var actionsEl = document.getElementById("actions");
var inputEl = document.getElementById("input");
var sendBtn = document.getElementById("send");

// ---- Session & Persistence (localStorage) ----
var THREAD_ID = localStorage.getItem("ff_thread_id");
if (!THREAD_ID) {
  THREAD_ID = "t_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  localStorage.setItem("ff_thread_id", THREAD_ID);
}

var HISTORY_KEY = "ff_chat_history_" + THREAD_ID;
var sending = false;

// ---- Sanitization ----
function escapeHtml(text) {
  var d = document.createElement("div");
  d.textContent = text;
  return d.innerHTML;
}

// ---- Analytics / Conversion Tracking ----
function trackEvent(event, data) {
  try {
    fetch(TRACK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ event: event, thread_id: THREAD_ID, data: data || {} }),
    });
  } catch(e) {}
}

// ---- Conversation Persistence ----
function saveHistory(role, text) {
  try {
    var history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    history.push({ role: role, text: text, ts: Date.now() });
    if (history.length > 50) history = history.slice(-50);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch(e) {}
}

function restoreHistory() {
  try {
    var history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    if (history.length === 0) return false;

    history.forEach(function(entry) {
      var div = document.createElement("div");
      div.className = "msg " + entry.role + " restored";
      div.textContent = entry.text;
      messagesEl.appendChild(div);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return true;
  } catch(e) { return false; }
}

// ---- UI Helpers ----
function addMessage(text, cls) {
  var div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showTyping() {
  var div = document.createElement("div");
  div.className = "typing";
  div.id = "typing-indicator";
  div.innerHTML = "<span></span><span></span><span></span>";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  var el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function clearActions() { actionsEl.innerHTML = ""; }

function renderProducts(products) {
  if (!products || products.length === 0) return;

  var container = document.createElement("div");
  container.className = "product-cards";

  products.forEach(function(p) {
    var card = document.createElement("div");
    card.className = "product-card";

    var imgHtml = p.image_url
      ? '<img src="' + escapeHtml(p.image_url) + '" alt="' + escapeHtml(p.title || '') + '" />'
      : '<div style="width:100%;height:120px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">No image</div>';

    var priceText = p.price ? "$" + parseFloat(p.price).toFixed(2) : "";

    var viewUrl = escapeHtml(p.url || "#");
    var viewBtn = '<a class="product-card-btn" href="' + viewUrl + '" target="_blank" data-track="view_product" data-product="' + escapeHtml(p.handle || '') + '">View Details</a>';

    var buyHtml = "";
    if (p.checkout_url && p.available !== false) {
      buyHtml = '<a class="product-card-buy" href="' + escapeHtml(p.checkout_url) + '" target="_blank" data-track="buy_click" data-product="' + escapeHtml(p.handle || '') + '">Buy Now</a>';
    }

    card.innerHTML =
      imgHtml +
      '<div class="product-card-body">' +
        '<div class="product-card-title">' + escapeHtml(p.title || "Product") + '</div>' +
        '<div class="product-card-price">' + escapeHtml(priceText) + '</div>' +
        viewBtn +
        buyHtml +
      '</div>';
    container.appendChild(card);

    trackEvent("product_impression", { handle: p.handle, title: p.title });
  });

  messagesEl.appendChild(container);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderActions(actions) {
  clearActions();
  if (!actions || actions.length === 0) return;

  actions.forEach(function(a) {
    if (a.type === "quick_reply") {
      var btn = document.createElement("button");
      btn.className = "quick-reply";
      btn.textContent = a.label || "Quick reply";
      btn.onclick = function() {
        trackEvent("quick_reply_click", { label: a.label });
        sendMessage(a.value || a.label);
      };
      actionsEl.appendChild(btn);
    } else if (a.type === "open_url") {
      var link = document.createElement("a");
      link.className = "url-btn";
      link.textContent = a.label || "Open link";
      link.href = a.url || "#";
      link.target = "_blank";
      link.onclick = function() {
        trackEvent("link_click", { label: a.label, url: a.url });
      };
      actionsEl.appendChild(link);
    }
  });
}

// ---- Click tracking for product cards (event delegation) ----
messagesEl.addEventListener("click", function(e) {
  var el = e.target.closest("[data-track]");
  if (el) {
    trackEvent(el.getAttribute("data-track"), {
      handle: el.getAttribute("data-product") || "",
      url: el.href || "",
    });
  }
});

// ---- SSE streaming send ----
async function sendMessage(text) {
  text = (text || "").trim();
  if (!text || sending) return;
  if (text.length > 1000) text = text.slice(0, 1000);
  sending = true;

  addMessage(text, "user");
  saveHistory("user", text);
  inputEl.value = "";
  clearActions();
  showTyping();
  sendBtn.disabled = true;

  try {
    var response = await fetch(STREAM_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: THREAD_ID }),
    });

    if (!response.ok || !response.body) {
      throw new Error("Stream unavailable");
    }

    var reader = response.body.getReader();
    var decoder = new TextDecoder();
    var buffer = "";
    var aiDiv = null;
    var aiText = "";

    while (true) {
      var result = await reader.read();
      if (result.done) break;

      buffer += decoder.decode(result.value, { stream: true });

      while (buffer.indexOf("\n\n") !== -1) {
        var idx = buffer.indexOf("\n\n");
        var chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);

        var lines = chunk.split("\n");
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].indexOf("data: ") !== 0) continue;
          var data;
          try { data = JSON.parse(lines[i].slice(6)); } catch(e) { continue; }

          if (data.type === "start") {
            if (data.thread_id) {
              THREAD_ID = data.thread_id;
              localStorage.setItem("ff_thread_id", THREAD_ID);
            }
          } else if (data.type === "token") {
            hideTyping();
            if (!aiDiv) {
              aiDiv = document.createElement("div");
              aiDiv.className = "msg ai";
              messagesEl.appendChild(aiDiv);
            }
            aiText += data.text;
            aiDiv.textContent = aiText;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } else if (data.type === "content") {
            hideTyping();
            aiText = data.text;
            if (!aiDiv) {
              aiDiv = addMessage(data.text, "ai");
            } else {
              aiDiv.textContent = data.text;
            }
          } else if (data.type === "products") {
            renderProducts(data.products);
          } else if (data.type === "actions") {
            renderActions(data.actions);
          } else if (data.type === "error") {
            hideTyping();
            aiText = data.text || "Something went wrong.";
            addMessage(aiText, "ai");
          }
        }
      }
    }

    if (aiText) saveHistory("ai", aiText);
    if (!aiDiv) hideTyping();

  } catch (e) {
    hideTyping();
    try {
      var resp = await fetch(FALLBACK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, thread_id: THREAD_ID }),
      });
      var data = await resp.json();
      if (data.content) {
        addMessage(data.content, "ai");
        saveHistory("ai", data.content);
      }
      if (data.products && data.products.length > 0) renderProducts(data.products);
      if (data.actions && data.actions.length > 0) renderActions(data.actions);
      if (data.thread_id) {
        THREAD_ID = data.thread_id;
        localStorage.setItem("ff_thread_id", THREAD_ID);
      }
    } catch (e2) {
      addMessage("Network error. Please check your connection.", "ai");
    }
  }

  sendBtn.disabled = false;
  sending = false;
}

sendBtn.onclick = function() { sendMessage(inputEl.value); };
inputEl.addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage(inputEl.value);
});

// ---- Initialize ----
var hasHistory = restoreHistory();
if (!hasHistory) {
  var greeting = "Hi! I'm here to help you find the perfect memorial for your beloved pet. Feel free to ask about our products, pricing, or policies.";
  addMessage(greeting, "ai");
  saveHistory("ai", greeting);
}

trackEvent("session_start", { restored: hasHistory });
</script>
</body>
</html>
