<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ForeverFurEver Agent</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f5f5f5;
  color: #333;
}

#chat-box {
  width: 440px;
  max-width: 100vw;
  margin: 20px auto;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
  display: flex;
  flex-direction: column;
  height: calc(100vh - 40px);
  max-height: 700px;
  overflow: hidden;
}

#chat-header {
  padding: 16px 20px;
  border-bottom: 1px solid #eee;
  font-weight: 600;
  font-size: 15px;
  color: #111;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  word-wrap: break-word;
  white-space: pre-wrap;
}

.user {
  align-self: flex-end;
  background: #111;
  color: #fff;
  border-bottom-right-radius: 4px;
}

.ai {
  align-self: flex-start;
  background: #f0f0f0;
  color: #111;
  border-bottom-left-radius: 4px;
}

/* Typing indicator */
.typing {
  align-self: flex-start;
  padding: 10px 14px;
  background: #f0f0f0;
  border-radius: 12px;
  display: flex;
  gap: 4px;
}
.typing span {
  width: 6px; height: 6px;
  background: #999;
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
}

/* Product cards */
.product-cards {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 8px 0;
  scroll-snap-type: x mandatory;
}
.product-cards::-webkit-scrollbar { height: 4px; }
.product-cards::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

.product-card {
  min-width: 160px;
  max-width: 180px;
  border: 1px solid #e5e5e5;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  scroll-snap-align: start;
  background: #fff;
}
.product-card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  background: #f5f5f5;
}
.product-card-body {
  padding: 8px 10px;
}
.product-card-title {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.3;
  color: #111;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.product-card-price {
  font-size: 13px;
  font-weight: 700;
  color: #111;
  margin-top: 4px;
}
.product-card-btn {
  display: block;
  width: 100%;
  padding: 6px;
  margin-top: 6px;
  border: 1px solid #111;
  border-radius: 6px;
  background: #fff;
  color: #111;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
}
.product-card-btn:hover { background: #111; color: #fff; }

/* Actions / Quick replies */
#actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 20px 8px;
}

.quick-reply {
  padding: 8px 14px;
  border: 1px solid #ddd;
  border-radius: 20px;
  background: #fff;
  color: #333;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.quick-reply:hover { background: #111; color: #fff; border-color: #111; }

.url-btn {
  padding: 8px 14px;
  border: none;
  border-radius: 20px;
  background: #111;
  color: #fff;
  font-size: 13px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.url-btn:hover { opacity: 0.85; }

/* Input area */
#input-area {
  display: flex;
  gap: 8px;
  padding: 12px 20px 16px;
  border-top: 1px solid #eee;
}

#input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
  outline: none;
}
#input:focus { border-color: #111; }

#send {
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  background: #111;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
}
#send:hover { opacity: 0.85; }

/* Animations */
.msg, .product-cards { animation: fadeIn 0.25s ease-out; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 480px) {
  #chat-box { width: 100%; height: 100vh; max-height: none; margin: 0; border-radius: 0; }
}
</style>
</head>
<body>

<div id="chat-box">
  <div id="chat-header">ForeverFurEver</div>
  <div id="messages"></div>
  <div id="actions"></div>
  <div id="input-area">
    <input id="input" placeholder="Ask me anything..." />
    <button id="send">Send</button>
  </div>
</div>

<script>
const API_URL = window.location.origin + "/chat";

const messagesEl = document.getElementById("messages");
const actionsEl = document.getElementById("actions");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

let THREAD_ID = sessionStorage.getItem("ff_thread_id");
if (!THREAD_ID) {
  THREAD_ID = "t_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  sessionStorage.setItem("ff_thread_id", THREAD_ID);
}

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing-indicator";
  div.innerHTML = "<span></span><span></span><span></span>";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function clearActions() {
  actionsEl.innerHTML = "";
}

function renderProducts(products) {
  if (!products || products.length === 0) return;

  const container = document.createElement("div");
  container.className = "product-cards";

  products.forEach(function(p) {
    const card = document.createElement("div");
    card.className = "product-card";

    const imgHtml = p.image_url
      ? '<img src="' + p.image_url + '" alt="' + (p.title || '') + '" />'
      : '<div style="width:100%;height:120px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">No image</div>';

    const priceText = p.price ? "$" + parseFloat(p.price).toFixed(2) : "";

    card.innerHTML =
      imgHtml +
      '<div class="product-card-body">' +
        '<div class="product-card-title">' + (p.title || "Product") + '</div>' +
        '<div class="product-card-price">' + priceText + '</div>' +
        '<a class="product-card-btn" href="' + (p.url || "#") + '" target="_blank">View Product</a>' +
      '</div>';
    container.appendChild(card);
  });

  messagesEl.appendChild(container);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderActions(actions) {
  clearActions();
  if (!actions || actions.length === 0) return;

  actions.forEach(function(a) {
    if (a.type === "quick_reply") {
      var btn = document.createElement("button");
      btn.className = "quick-reply";
      btn.textContent = a.label || "Quick reply";
      btn.onclick = function() { sendMessage(a.value || a.label); };
      actionsEl.appendChild(btn);
    } else if (a.type === "open_url") {
      var link = document.createElement("a");
      link.className = "url-btn";
      link.textContent = a.label || "Open link";
      link.href = a.url || "#";
      link.target = "_blank";
      actionsEl.appendChild(link);
    }
  });
}

function sendMessage(text) {
  text = (text || "").trim();
  if (!text) return;

  addMessage(text, "user");
  inputEl.value = "";
  clearActions();
  showTyping();

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, thread_id: THREAD_ID }),
  })
  .then(function(resp) { return resp.json(); })
  .then(function(data) {
    hideTyping();

    if (data.type === "error") {
      addMessage("Sorry, something went wrong. Please try again.", "ai");
      return;
    }

    if (data.content) {
      addMessage(data.content, "ai");
    }

    if (data.products && data.products.length > 0) {
      renderProducts(data.products);
    }

    if (data.actions && data.actions.length > 0) {
      renderActions(data.actions);
    }

    if (data.thread_id) {
      THREAD_ID = data.thread_id;
      sessionStorage.setItem("ff_thread_id", THREAD_ID);
    }
  })
  .catch(function() {
    hideTyping();
    addMessage("Network error. Please check your connection.", "ai");
  });
}

sendBtn.onclick = function() { sendMessage(inputEl.value); };
inputEl.addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage(inputEl.value);
});

addMessage("Hi! I'm here to help you find the perfect memorial for your beloved pet. Feel free to ask about our products, pricing, or policies.", "ai");
</script>
</body>
</html>
