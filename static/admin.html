<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForeverFurEver Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #9580D6;
      --brand-dark: #7A68B8;
      --brand-light: #EDE9F6;
      --text: #1a1a1a;
      --text-muted: rgba(0,0,0,0.55);
      --bg: #f7f6fa;
      --white: #ffffff;
      --border: #e8e5ef;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--white); border-radius: 16px; padding: 40px; max-width: 420px; width: 90%; box-shadow: 0 4px 24px rgba(149,128,214,0.12); }
    h1 { font-size: 20px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    h1::before { content: "✦"; color: var(--brand); }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
    input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; transition: border-color 0.15s; }
    input:focus { border-color: var(--brand); }
    .btn { width: 100%; margin-top: 20px; padding: 12px; background: var(--brand); color: var(--white); border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .btn:hover { background: var(--brand-dark); }
    .btn:disabled { background: #c4b8e8; cursor: not-allowed; }
    .result { margin-top: 20px; padding: 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; display: none; }
    .result.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .result.error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .result.pending { background: var(--brand-light); border: 1px solid #d4c8f0; color: var(--brand-dark); }
    .synced-list { margin-top: 8px; padding-left: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Knowledge Base Sync</h1>
    <p class="subtitle">从 Notion 同步知识库到 Agent</p>

    <label for="token">Admin Token</label>
    <input type="password" id="token" placeholder="输入管理员密码" autocomplete="off">

    <button class="btn" id="syncBtn" onclick="doSync()">同步知识库</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    const tokenInput = document.getElementById('token');
    const btn = document.getElementById('syncBtn');
    const result = document.getElementById('result');
    const saved = sessionStorage.getItem('admin_token');
    if (saved) tokenInput.value = saved;

    function showResult(cls, html) {
      result.className = 'result ' + cls;
      result.innerHTML = html;
      result.style.display = 'block';
    }

    async function pollStatus(token) {
      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 3000));
        try {
          const resp = await fetch('/admin/sync-status', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await resp.json();

          if (!data.running && data.last_result) {
            const r = data.last_result;
            if (r.ok) {
              let html = '<strong>同步成功</strong>';
              if (r.synced && r.synced.length) {
                html += '<ul class="synced-list">' + r.synced.map(t => '<li>' + t + '</li>').join('') + '</ul>';
              }
              if (r.skipped && r.skipped.length) {
                html += '<br>跳过: ' + r.skipped.join(', ');
              }
              showResult('success', html);
            } else {
              showResult('error', '同步失败: ' + (r.error || '未知错误'));
            }
            btn.disabled = false;
            btn.textContent = '同步知识库';
            return;
          }
        } catch (e) { /* keep polling */ }
      }
      showResult('error', '同步超时，请刷新页面后重试');
      btn.disabled = false;
      btn.textContent = '同步知识库';
    }

    async function doSync() {
      const token = tokenInput.value.trim();
      if (!token) { tokenInput.focus(); return; }

      sessionStorage.setItem('admin_token', token);
      btn.disabled = true;
      btn.textContent = '同步中...';
      showResult('pending', '正在从 Notion 拉取内容并更新索引，请稍等...');

      try {
        const resp = await fetch('/admin/sync-knowledge', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await resp.json();

        if (!resp.ok) {
          showResult('error', data.detail || '请检查密码是否正确');
          btn.disabled = false;
          btn.textContent = '同步知识库';
          return;
        }

        if (data.status === 'started' || data.status === 'already_running') {
          pollStatus(token);
        }
      } catch (e) {
        showResult('error', '网络错误: ' + e.message);
        btn.disabled = false;
        btn.textContent = '同步知识库';
      }
    }

    tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSync(); });
  </script>
</body>
</html>
